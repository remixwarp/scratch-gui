<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        #container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script>
        require.config({
            paths: {
                'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs'
            }
        });

        var editor = null;
        var currentTheme = 'vs-dark';
        var currentLanguage = 'plaintext';
        var currentWordWrap = 'on';
        var monacoLoaded = false;
        var pendingInit = null; // 缓存 monaco 加载完成前收到的 init 消息

        // 立即注册消息监听器（在 monaco 加载完成之前）
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'monaco-init':
                    if (monacoLoaded) {
                        createEditor(data.content, data.language, data.theme, data.wordWrap);
                    } else {
                        // monaco 还没加载完，缓存 init 数据
                        pendingInit = data;
                    }
                    break;

                case 'monaco-set-content':
                    if (editor) {
                        if (data.language) {
                            var langMap2 = {
                                'json': 'json',
                                'svg': 'xml',
                                'xml': 'xml',
                                'javascript': 'javascript',
                                'js': 'javascript',
                                'jsx': 'javascript',
                                'typescript': 'typescript',
                                'ts': 'typescript',
                                'tsx': 'typescript',
                                'css': 'css',
                                'html': 'html'
                            };
                            var lang2 = langMap2[data.language] || 'plaintext';
                            if (lang2 !== currentLanguage) {
                                currentLanguage = lang2;
                                monaco.editor.setModelLanguage(editor.getModel(), lang2);
                            }
                        }
                        if (editor.getValue() !== data.content) {
                            editor.setValue(data.content || '');
                        }
                    }
                    break;

                case 'monaco-set-theme':
                    currentTheme = data.theme || 'vs-dark';
                    if (editor) {
                        monaco.editor.setTheme(currentTheme);
                    }
                    break;

                case 'monaco-set-wordwrap':
                    currentWordWrap = data.wordWrap ? 'on' : 'off';
                    if (editor) {
                        editor.updateOptions({ wordWrap: currentWordWrap });
                    }
                    break;

                case 'monaco-dispose':
                    if (editor) {
                        editor.dispose();
                        editor = null;
                    }
                    break;

                case 'monaco-focus':
                    if (editor) {
                        editor.focus();
                    }
                    break;
            }
        });

        function createEditor(value, language, theme, wordWrap) {
            if (editor) {
                editor.dispose();
                editor = null;
            }

            var lang = language || 'plaintext';
            var thm = theme || 'vs-dark';
            var wrap = wordWrap || 'on';

            var langMap = {
                'json': 'json',
                'svg': 'xml',
                'xml': 'xml',
                'javascript': 'javascript',
                'js': 'javascript',
                'jsx': 'javascript',
                'typescript': 'typescript',
                'ts': 'typescript',
                'tsx': 'typescript',
                'css': 'css',
                'html': 'html',
                'plaintext': 'plaintext'
            };

            currentLanguage = langMap[lang] || 'plaintext';
            currentTheme = thm;
            currentWordWrap = wrap;

            editor = monaco.editor.create(document.getElementById('container'), {
                value: value || '',
                language: currentLanguage,
                theme: currentTheme,
                automaticLayout: true,
                fontFamily: 'JetBrains Mono, Fira Code, Menlo, Monaco, Consolas, monospace',
                fontLigatures: true,
                fontSize: 13,
                // 面包屑：顶部显示文件路径 / 符号层级，点击可快速跳转
                breadcrumbs: {enabled: true, showFileKind: true, showSymbol: true},
                // 吸顶滚动：滚动时固定显示当前作用域标题
                stickyScroll: {enabled: true},
                // 缩进参考线，长代码块层次更清晰
                guides: {indentation: true, highlightActiveIndentation: true},
                // 小地图（之前为 disabled，现已开启）
                minimap: {enabled: true, renderCharacters: true, maxColumn: 120},
                // 代码折叠（区域 + 高阶符号）
                folding: true,
                foldingHighlight: true,
                showFoldingControls: 'always',
                // 滚轮缩放字号（Ctrl/⌘ + 滚轮）
                mouseWheelZoom: true,
                wordWrap: currentWordWrap,
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                renderLineHighlight: 'all',
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                smoothScrolling: true,
                // 黏贴板多光标、列选择
                multiCursorModifier: 'ctrlCmd',
                columnSelection: true,
                tabSize: 4,
                padding: {top: 8},
                largeFileOptimizations: true,
                scrollbar: {
                    verticalScrollbarSize: 12,
                    horizontalScrollbarSize: 12,
                    useShadows: false
                }
            });

            editor.onDidChangeModelContent(function() {
                var content = editor.getValue();
                window.parent.postMessage({
                    type: 'monaco-content-change',
                    content: content
                }, '*');
            });

            // 自动聚焦编辑器
            setTimeout(function() {
                if (editor) {
                    editor.focus();
                }
            }, 100);

            window.parent.postMessage({
                type: 'monaco-ready'
            }, '*');
        }

        // 加载 Monaco Editor
        require(['vs/editor/editor.main'], function() {
            monacoLoaded = true;

            // 监听点击事件，确保编辑器获得焦点
            document.addEventListener('click', function() {
                if (editor) {
                    editor.focus();
                }
            });

            // 通知父窗口 monaco 已就绪
            window.parent.postMessage({
                type: 'monaco-ready'
            }, '*');

            // 如果有缓存的 init 消息，立即创建编辑器
            if (pendingInit) {
                createEditor(
                    pendingInit.content,
                    pendingInit.language,
                    pendingInit.theme,
                    pendingInit.wordWrap
                );
                pendingInit = null;
            }
        });
    </script>
</body>
</html>
