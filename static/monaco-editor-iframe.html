<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <title>Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1e1e1e;
        }
        #container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- Monaco 的 loader 在页面底部按“本地优先、CDN 兜底”的方式加载，见文件末尾 -->
    <script>
        var editor = null;
        var currentTheme = 'vs-dark';
        var currentLanguage = 'plaintext';
        var currentWordWrap = 'on';
        var monacoLoaded = false;
        var pendingInit = null; // 缓存 monaco 加载完成前收到的 init 消息
        var containerObserver = null;
        var layoutListenerAdded = false;

        // 可由父窗口（超级重构设置）动态调整的编辑器选项
        var currentOptions = {
            minimap: {
                enabled: true,
                side: 'right',
                size: 'proportional',
                showSlider: 'mouseover',
                renderCharacters: true,
                maxColumn: 120,
                scale: 1
            },
            breadcrumbs: {enabled: true, showFileKind: true, showSymbol: true},
            stickyScroll: {enabled: true},
            guides: {indentation: true, highlightActiveIndentation: true},
            folding: true,
            foldingHighlight: true,
            showFoldingControls: 'always',
            wordWrap: 'on',
            lineNumbers: 'on',
            renderLineHighlight: 'all',
            smoothScrolling: true,
            mouseWheelZoom: true,
            fontSize: 13,
            tabSize: 4,
            renderWhitespace: 'selection'
        };

        var mergeOptions = function(target, source) {
            if (!source) return target;
            Object.keys(source).forEach(function(key) {
                var value = source[key];
                if (value && typeof value === 'object' && !Array.isArray(value)) {
                    if (!target[key] || typeof target[key] !== 'object') target[key] = {};
                    mergeOptions(target[key], value);
                } else if (value !== undefined) {
                    target[key] = value;
                }
            });
            return target;
        };

        // 立即注册消息监听器（在 monaco 加载完成之前）
        window.addEventListener('message', function(event) {
            var data = event.data;
            if (!data || !data.type) return;

            switch (data.type) {
                case 'monaco-init':
                    mergeOptions(currentOptions, data.options || {});
                    if (monacoLoaded) {
                        createEditor(data.content, data.language, data.theme, data.wordWrap);
                    } else {
                        // monaco 还没加载完，缓存 init 数据
                        pendingInit = data;
                    }
                    break;

                case 'monaco-set-options':
                    mergeOptions(currentOptions, data.options || {});
                    if (editor) {
                        editor.updateOptions(currentOptions);
                    }
                    break;

                case 'monaco-set-content':
                    if (editor) {
                        if (data.language) {
                            var langMap2 = {
                                'json': 'json',
                                'svg': 'xml',
                                'xml': 'xml',
                                'javascript': 'javascript',
                                'js': 'javascript',
                                'jsx': 'javascript',
                                'typescript': 'typescript',
                                'ts': 'typescript',
                                'tsx': 'typescript',
                                'css': 'css',
                                'html': 'html'
                            };
                            var lang2 = langMap2[data.language] || 'plaintext';
                            if (lang2 !== currentLanguage) {
                                currentLanguage = lang2;
                                monaco.editor.setModelLanguage(editor.getModel(), lang2);
                            }
                        }
                        if (editor.getValue() !== data.content) {
                            editor.setValue(data.content || '');
                        }
                    }
                    break;

                case 'monaco-set-theme':
                    currentTheme = data.theme || 'vs-dark';
                    if (editor) {
                        monaco.editor.setTheme(currentTheme);
                    }
                    break;

                case 'monaco-set-wordwrap':
                    currentWordWrap = data.wordWrap ? 'on' : 'off';
                    currentOptions.wordWrap = currentWordWrap;
                    if (editor) {
                        editor.updateOptions({ wordWrap: currentWordWrap });
                    }
                    break;

                case 'monaco-dispose':
                    if (editor) {
                        editor.dispose();
                        editor = null;
                    }
                    break;

                case 'monaco-focus':
                    if (editor) {
                        editor.focus();
                    }
                    break;

                case 'monaco-relayout':
                    // 自由窗口缩放时由父窗口通知，让小地图/编辑器重新适配可用尺寸
                    if (editor) {
                        editor.layout();
                    }
                    break;
            }
        });

        function createEditor(value, language, theme, wordWrap) {
            if (editor) {
                editor.dispose();
                editor = null;
            }

            var lang = language || 'plaintext';
            var thm = theme || 'vs-dark';
            var wrap = wordWrap || 'on';

            var langMap = {
                'json': 'json',
                'svg': 'xml',
                'xml': 'xml',
                'javascript': 'javascript',
                'js': 'javascript',
                'jsx': 'javascript',
                'typescript': 'typescript',
                'ts': 'typescript',
                'tsx': 'typescript',
                'css': 'css',
                'html': 'html',
                'plaintext': 'plaintext'
            };

            currentLanguage = langMap[lang] || 'plaintext';
            currentTheme = thm;
            currentWordWrap = wrap;
            currentOptions.wordWrap = wrap;

            var editorOptions = {
                value: value || '',
                language: currentLanguage,
                theme: currentTheme,
                automaticLayout: true,
                fontFamily: 'JetBrains Mono, Fira Code, Menlo, Monaco, Consolas, monospace',
                fontLigatures: true,
                scrollBeyondLastLine: false,
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                // 黏贴板多光标、列选择
                multiCursorModifier: 'ctrlCmd',
                columnSelection: true,
                padding: {top: 8},
                largeFileOptimizations: true,
                scrollbar: {
                    verticalScrollbarSize: 12,
                    horizontalScrollbarSize: 12,
                    useShadows: false
                }
            };

            // 合并来自父窗口的选项（小地图、折叠、面包屑、字号等）
            mergeOptions(editorOptions, currentOptions);

            editor = monaco.editor.create(document.getElementById('container'), editorOptions);

            // 自由窗口缩放时 iframe 尺寸会变化，主动重新布局，
            // 保证小地图和正文按新的可用宽度重新排布
            if (typeof ResizeObserver !== 'undefined') {
                if (containerObserver) containerObserver.disconnect();
                containerObserver = new ResizeObserver(function() {
                    if (editor) editor.layout();
                });
                containerObserver.observe(document.getElementById('container'));
            }
            if (!layoutListenerAdded) {
                layoutListenerAdded = true;
                window.addEventListener('resize', function() {
                    if (editor) editor.layout();
                });
            }

            editor.onDidChangeModelContent(function() {
                var content = editor.getValue();
                window.parent.postMessage({
                    type: 'monaco-content-change',
                    content: content
                }, '*');
            });

            // 自动聚焦编辑器
            setTimeout(function() {
                if (editor) {
                    editor.focus();
                }
            }, 100);

            window.parent.postMessage({
                type: 'monaco-ready'
            }, '*');
        }

        // 加载 Monaco Editor
        // 本地优先：webpack 会把 node_modules/monaco-editor/min/vs 复制到 monaco/vs，
        // 离线或 CDN 不可用时依然能用；本地文件缺失时再回退到 CDN。
        var MONACO_LOCAL_BASE = 'monaco/vs';
        var MONACO_CDN_BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs';

        var loadMonacoLoader = function (base) {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = base + '/loader.js';
                script.onload = resolve;
                script.onerror = function () {
                    reject(new Error('无法加载 ' + script.src));
                };
                document.head.appendChild(script);
            });
        };

        var startMonaco = function (base) {
            require.config({
                paths: {
                    'vs': base
                }
            });
            require(['vs/editor/editor.main'], function() {
                monacoLoaded = true;

                // 监听点击事件，确保编辑器获得焦点
                document.addEventListener('click', function() {
                    if (editor) {
                        editor.focus();
                    }
                });

                // 通知父窗口 monaco 已就绪
                window.parent.postMessage({
                    type: 'monaco-ready'
                }, '*');

                // 如果有缓存的 init 消息，立即创建编辑器
                if (pendingInit) {
                    createEditor(
                        pendingInit.content,
                        pendingInit.language,
                        pendingInit.theme,
                        pendingInit.wordWrap
                    );
                    pendingInit = null;
                }
            });
        };

        loadMonacoLoader(MONACO_LOCAL_BASE).then(function () {
            startMonaco(MONACO_LOCAL_BASE);
        }, function () {
            loadMonacoLoader(MONACO_CDN_BASE).then(function () {
                startMonaco(MONACO_CDN_BASE);
            }, function (error) {
                console.error('[monaco] 加载失败', error);
            });
        });
    </script>
</body>
</html>
